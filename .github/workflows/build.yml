name: build-rmx3630-kernel

on:
  workflow_dispatch:
    inputs:
      kernel_sha:
        description: "realme10-AndroidU-kernel-source commit (empty = pinned)"
        required: false
        default: ""
      vendor_sha:
        description: "realme10-AndroidU-vendor-source commit (empty = pinned)"
        required: false
        default: ""
  push:
    branches: [ main ]
    paths:
      - 'scripts/**'
      - 'configs/**'
      - 'expected/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: build-rmx3630-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    env:
      WORK: ${{ github.workspace }}/work
      OUT: ${{ github.workspace }}/work/out
      # CRC baseline experiment: "1" builds the untouched OEM defconfig.
      STOCK_CONFIG_ONLY: "1"
      KERNEL_SHA: ${{ inputs.kernel_sha || '01f8dc938ab93110bac0e72b2d235f279b4de614' }}
      VENDOR_SHA: ${{ inputs.vendor_sha || 'e92b9be280b5f8cf299c2bde1c5cf29cc3e98ba3' }}
      CLANG_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-12.0.0_r21/clang-r416183b.tar.gz
      # ccache: the kernel build is ~99% recompilation of unchanged objects, so a
      # warm cache turns a 19-minute run into a few minutes. Slopiness is required
      # for kernel sources (__DATE__/__TIME__ macros, mtimes inside headers).
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3G
      CCACHE_COMPRESS: "true"
      CCACHE_COMPRESSLEVEL: "6"
      CCACHE_SLOPPINESS: "time_macros,include_file_mtime,file_macro"
      CCACHE_BASEDIR: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bison flex bc libssl-dev libelf-dev binutils-aarch64-linux-gnu ccache
          bison --version | head -1
          aarch64-linux-gnu-elfedit --version | head -1
          ccache --version | head -1

      - name: Cache clang toolchain
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/clang
          key: clang-r416183b-tar-v1

      - name: Fetch toolchain (Android clang r416183b / 12.0.5)
        run: |
          mkdir -p "$RUNNER_TEMP/clang"
          if [ -x "$RUNNER_TEMP/clang/bin/clang" ]; then
            echo "toolchain restored from cache"
          else
            curl -fsSL --retry 3 "$CLANG_URL" | tar -xz -C "$RUNNER_TEMP/clang"
          fi
          echo "CLANG_DIR=$RUNNER_TEMP/clang" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/clang/bin/clang" --version

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ env.KERNEL_SHA }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ env.KERNEL_SHA }}-
            ccache-

      - name: Fetch OEM kernel + vendor sources
        run: bash scripts/fetch.sh

      - name: Configure (stock release string + Docker feature set)
        run: bash scripts/configure.sh

      - name: Build Image.gz and modules
        timeout-minutes: 300
        run: bash scripts/build.sh

      - name: ccache stats
        if: always()
        run: |
          ccache --show-stats --verbose || true

      - name: Release string gate (vermagic)
        if: always()
        run: |
          expected="$(tr -d '[:space:]' < expected/release.txt)"
          rel="$(tr -d '[:space:]' < "$OUT/include/config/kernel.release" 2>/dev/null || true)"
          {
            echo ""
            echo "### Release string (vermagic)"
            echo ""
            echo '```'
            echo "built   : ${rel:-<missing>}"
            echo "expected: $expected"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$rel" ]; then
            echo "::error::include/config/kernel.release is missing - build produced no release string"
            exit 1
          fi
          if [ "$rel" != "$expected" ]; then
            echo "::error::release string mismatch: built '$rel' != expected '$expected'"
            case "$rel" in
              *+) echo "::error::dirty-tree '+' suffix present - vermagic cannot match the stock modules" ;;
            esac
            exit 1
          fi
          echo "release string gate: PASS ($rel)"

      - name: CRC gate (stock vendor modules)
        if: always()
        run: |
          set -o pipefail
          rc=0
          python3 scripts/compare_symbols.py "$OUT" expected | tee crc-report.txt || rc=$?
          {
            echo ""
            echo "### Kernel"
            echo ""
            echo '```'
            echo "release: $(cat "$OUT/include/config/kernel.release" 2>/dev/null)"
            grep -E '^CONFIG_(PID_NS|IPC_NS|USER_NS|SYSVIPC|POSIX_MQUEUE|CGROUP_PIDS|CGROUP_DEVICE)=' "$OUT/.config" 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat crc-report.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

          if [ "$rc" -ne 0 ]; then
            echo "::error::CRC gate FAILED - stock vendor modules would not load (see crc-report.txt)"
            exit 1
          fi
          echo "CRC gate: PASS"

      - name: Package artifacts
        if: always()
        run: |
          mkdir -p dist
          cp -v "$OUT/Image.gz" dist/ || true
          cp -v "$OUT/arch/arm64/boot/Image" dist/ || true
          cp -v "$OUT/System.map" dist/ || true
          cp -v "$OUT/Module.symvers" dist/ || true
          cp -v "$OUT/.config" dist/kernel.config || true
          cp -v crc-report.txt dist/ || true
          if find "$OUT" -name '*.ko' -print -quit | grep -q .; then
            tar -czf dist/modules.tar.gz -C "$OUT" \
              $(find "$OUT" -name '*.ko' -printf '%P\n')
          fi
          ls -lh dist

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rmx3630-kernel-${{ github.run_number }}
          path: dist/
          if-no-files-found: warn
          retention-days: 14
